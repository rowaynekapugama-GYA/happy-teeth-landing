<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Happy Teeth Springwood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,560&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#286050;--green-deep:#1B453A;--green-ink:#12332B;--gold:#A47D50;--gold-deep:#8A6740;
--salmon:#DDA090;--salmon-deep:#CE8270;--cream:#FAF6F1}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--green-ink);color:#fff;
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;-webkit-font-smoothing:antialiased}
.card{max-width:520px;width:100%;text-align:center}
.logo{background:var(--green);border-radius:18px;padding:14px 20px;display:inline-block;margin-bottom:28px}
.logo img{height:52px;width:auto;display:block}
h1{font-family:'Fraunces',serif;font-weight:560;font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.15;margin-bottom:10px}
p{color:#BCD2C9;font-size:1rem;margin-bottom:28px}
.links{display:grid;gap:14px}
a.btn{display:block;padding:18px 22px;border-radius:16px;text-decoration:none;color:#fff;font-weight:800;
font-size:1rem;transition:transform .15s ease}
a.btn span{display:block;font-weight:500;font-size:.85rem;opacity:.85;margin-top:3px}
a.btn:hover{transform:translateY(-2px)}
.implants{background:linear-gradient(135deg,var(--gold),var(--gold-deep))}
.aligners{background:linear-gradient(135deg,var(--salmon),var(--salmon-deep))}
.foot{margin-top:26px;font-size:.78rem;color:#7E988D}
</style>
</head>
<body>
  <div class="card">
    <span class="logo"><img src="images/logo.png" width="800" height="239" alt="Happy Teeth Springwood"></span>
    <h1>Which treatment are you interested in?</h1>
    <p>Springwood Mall, QLD &middot; Free consultation</p>
    <div class="links">
      <a class="btn implants" href="dental-implants.html">Dental Implants &amp; All-on-X<span>From $39 per week</span></a>
      <a class="btn aligners" href="clear-aligners.html">Clear Aligners<span>From $59 per week</span></a>
    </div>
    <p class="foot">Happy Teeth Springwood</p>
  </div>
</body>
</html>
